# Web only: gpui-pre-web needs nightly on wasm (parking_lot's `nightly` feature).
# The Mac and iOS builds use native/rust-toolchain.toml (stable).
[toolchain]
channel = "nightly-2026-10-31"
profile = "minimal"
components = ["rust-src"]
targets = ["wasm32-unknown-unknown"]
