name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned Flutter version
        id: pin
        run: |
          v=$(tr -d '[:space:]' < .flutter-version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: true
      - name: Check Flutter version matches the pin
        run: |
          flutter --version | head -1 | grep -q "Flutter ${{ steps.pin.outputs.version }} "
      - name: Analyze and test every Dart package
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(git ls-files '*pubspec.yaml' | xargs -r -n1 dirname | sort)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No Dart packages yet; nothing to analyze."
            exit 0
          fi
          for p in "${pkgs[@]}"; do
            echo "::group::$p"
            if [ -f "$p/pubspec.lock" ]; then
              (cd "$p" && flutter pub get --enforce-lockfile)
            else
              (cd "$p" && flutter pub get)
            fi
            (cd "$p" && flutter analyze)
            (cd "$p" && dart format --output=none --set-exit-if-changed lib test)
            if [ -d "$p/test" ]; then (cd "$p" && flutter test); fi
            echo "::endgroup::"
          done
      - name: Check research scripts
        run: |
          bash -n spikes/korean-input/tool/linux_ime.sh
          python3 -m py_compile spikes/korean-input/tool/*.py

  linux-ime:
    name: linux-ime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned Flutter version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: true
      - name: Install native input experiment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            fcitx5 fcitx5-hangul fcitx5-frontend-gtk3 xvfb xdotool imagemagick \
            dbus-x11 python3-gi gir1.2-gtk-3.0 fonts-wqy-zenhei
      - name: Build and record the real fcitx5 path
        working-directory: spikes/korean-input
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --debug --dart-define=IME_TRACE=true
          tool/linux_ime.sh "$RUNNER_TEMP/korean-input-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ime-observations
          path: ${{ runner.temp }}/korean-input-evidence
          if-no-files-found: error
