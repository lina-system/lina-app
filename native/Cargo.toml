# SPDX-License-Identifier: AGPL-3.0-only
# Rust workspace for the native apps (lina-app#76): a platform-free core and a GPUI app.

[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.99.1"

[workspace.dependencies]
lina-core = { path = "core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# GPUI from crates.io, pinned. Default features keep the Linux backends in the
# lock file; the app is only built on macOS in this round.
gpui = "=0.2.2"
unicode-segmentation = "=1.13.3"

[profile.release]
debug = false
