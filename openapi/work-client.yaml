# Copied unchanged from lina-system/lina docs/api/work-client.yaml at dev commit df3b9926391eb9c04f5451dbd5679b12ed3f2c05,
# plus the optional WorkCardSummary/WorkCardDetail fields endedAt and lastHeartbeatAt that lina#577 adds (lina-app#100)
# and the optional WorkCardSummary fields waitingOn and retry that lina#629 adds (lina-app#119),
# and the optional readOnly (WorkCardSummary, WorkCardDetail, WorkGoal) and detail (WorkCardSummary) fields that
# lina#481 adds (lina-app#149),
# and the optional detail-only plain.history (PlainHistoryLine, PlainDetailLines) the core adds for G138 (lina-app#269),
# and the report paths and schemas (ReportSummary, ReportList, ReportVersion, Report, ReportReference), copied unchanged
# from dev commit 64c1691545c4a7092703b3a644389815aabf0d30 (lina#263, lina-app#50).
# Work endpoints the app reads: goals, work cards, their worker runs and the owner inbox.
# Served by plugins/kanban/dashboard/work_api.py under /api/plugins/kanban/work, behind the
# dashboard auth gate (session token). lina-app's scripts/generate-client.mjs can point
# SCHEMA_SOURCE at this file. tests/plugins/test_kanban_work_api.py validates served JSON
# against it, so a shape change here and in the code land together.
openapi: 3.0.3
info:
  title: LINA work API
  version: 0.1.0
  description: >
    Goals (goal cards with their work cards and the evidence that closed them), work cards
    (summary and detail), and the owner inbox with one write: answer an item as the owner.
    A work card is a goal-mode kanban card that is a link-parent of another card (its goal
    card). Times are Unix epoch seconds.
servers:
  - url: /api/plugins/kanban
paths:
  /work/goals:
    get:
      operationId: listWorkGoals
      summary: Goal cards with their work cards and evidence.
      parameters:
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Goal list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalList"
  /work/goals/{id}:
    get:
      operationId: getWorkGoal
      summary: One goal card.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: The goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkGoal"
        "404":
          description: No such card, or the card is not a goal card.
  /work/cards:
    get:
      operationId: listWorkCards
      summary: Work cards, optionally for one agent or in one state.
      parameters:
        - name: agent
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Work card summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCardList"
        "400":
          description: Unknown state.
  /work/cards/{id}:
    get:
      operationId: getWorkCard
      summary: One card with to-dos, worker runs, gate results, comments and runs.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Card detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCardDetail"
        "404":
          description: No such card.
  /work/inbox:
    get:
      operationId: getWorkInbox
      summary: Blocked cards and unanswered owner questions.
      parameters:
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
  /work/inbox/{id}/answer:
    post:
      operationId: answerWorkInboxItem
      summary: Comment on the card as the owner; unblock it when it is blocked for input.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          description: Empty text, or the author is the card's assignee.
        "404":
          description: No such card.
  # Reports (lina#263): served by hermes_cli/web_routers/lina_reports.py under /api/lina, behind the same dashboard
  # auth gate. tests/hermes_cli/test_lina_reports_api.py validates served JSON against these schemas. An update is
  # announced on GET /api/lina/events as source `reports` (docs/api/board-client.yaml ChangeEvent).
  /reports:
    servers:
      - url: /api/lina
    get:
      operationId: listReports
      summary: Reports, newest change first, optionally of one work card and one goal (no bodies).
      parameters:
        - name: card
          in: query
          required: false
          description: Only reports of this work card (the id `/work/cards/{id}` takes).
          schema:
            type: string
        - name: goal
          in: query
          required: false
          description: Only reports of this goal.
          schema:
            type: string
      responses:
        "200":
          description: The reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "503":
          description: The store cannot be read.
  /reports/{id}:
    servers:
      - url: /api/lina
    get:
      operationId: getReport
      summary: One report with its newest body, or with one earlier version's.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: version
          in: query
          required: false
          description: Show this version's title, summary and body instead of the newest.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: No such report or version, or a private report and the request is not the owner's session.
        "503":
          description: The store cannot be read.
  /reports/{id}/page:
    servers:
      - url: /
    get:
      operationId: getReportPage
      summary: >
        The report as a plain HTML page, for a browser that opens the link a chat message carries. Its newest
        version; it reloads itself every 30 s. Raw HTML in the body is shown as text, only http(s), mailto and
        same-site addresses are kept, and the Content-Security-Policy allows no script.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Not signed in; to the dashboard sign-in, which returns here (the dashboard's auth gate).
        "404":
          description: No such report, or a private report and the request is not the owner's session.
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Board:
      name: board
      in: query
      required: false
      description: Kanban board slug; omit for the current board.
      schema:
        type: string
  schemas:
    WorkState:
      type: string
      description: >
        planned (triage, todo, scheduled, ready); in_progress (running with a live run);
        waiting (review, or a gate still waiting with exit 75); stopped (blocked, or running
        with no live run); done.
      enum:
        - planned
        - in_progress
        - waiting
        - stopped
        - done
    Reason:
      type: string
      nullable: true
      description: >
        One word after the state, when there is one: the column for planned; review or gate
        for waiting; the block kind, gate, budget or unresponsive for stopped.
    TodoProgress:
      type: object
      additionalProperties: false
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    PlainLines:
      type: object
      additionalProperties: false
      description: >
        Checked model-written lines (lina#151). A field that failed its check, or was never written, is null; the
        raw source text is never served in its place.
      required: [title, now, result]
      properties:
        title:
          type: string
          nullable: true
          maxLength: 25
        now:
          type: string
          nullable: true
          maxLength: 60
        result:
          type: string
          nullable: true
          maxLength: 80
    PlainHistoryLine:
      type: object
      additionalProperties: false
      description: >
        One step of a card's history (G138): a now line the card moved past, as one past-tense sentence. Checked as
        the now line is, plus the past-tense check: at most 40 letters, one sentence, no English word, number, path,
        hash, device name or worker id, and no bot's name as its subject.
      required: [at, until, text]
      properties:
        at:
          type: integer
          description: When that now line started (when its writer stored it), epoch seconds.
        until:
          type: integer
          nullable: true
          description: When it changed to another sentence, epoch seconds; null when backfilled or for the last line.
        text:
          type: string
          maxLength: 40
    PlainDetailLines:
      type: object
      additionalProperties: false
      description: >
        A card detail's checked lines: the list row's PlainLines plus its history (G138). The list response keeps
        PlainLines.
      required: [title, now, result]
      properties:
        title:
          type: string
          nullable: true
          maxLength: 25
        now:
          type: string
          nullable: true
          maxLength: 60
        result:
          type: string
          nullable: true
          maxLength: 80
        history:
          type: array
          maxItems: 40
          description: The card's steps, newest first, at most 40. Missing or empty when the core has none.
          items:
            $ref: "#/components/schemas/PlainHistoryLine"
    WorkCardSummary:
      type: object
      additionalProperties: false
      required: [id, title, agent, state, reason, elapsedSeconds, todoProgress, now, plain]
      properties:
        id:
          type: string
        title:
          type: string
        agent:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        elapsedSeconds:
          type: integer
          minimum: 0
        todoProgress:
          $ref: "#/components/schemas/TodoProgress"
        now:
          type: string
          nullable: true
          maxLength: 120
          description: The latest comment or heartbeat note, plain text.
        plain:
          $ref: "#/components/schemas/PlainLines"
        endedAt:
          type: integer
          nullable: true
          description: When a done card completed (completed_at, epoch seconds); null otherwise (lina#577).
        lastHeartbeatAt:
          type: integer
          nullable: true
          description: The card's last heartbeat (epoch seconds); null when it has none (lina#577).
        waitingOn:
          type: string
          nullable: true
          description: >
            On a stopped card (lina#629): who has to act next, `owner`, `agent:<id>`, or null when nobody has to
            (for example the work was replaced or its goal finished).
        retry:
          type: string
          nullable: true
          enum: [scheduled, none, null]
          description: >
            On a stopped card (lina#629): whether it will be tried again, `scheduled` (the core or the agent will
            start another run), `none`, or null when unknown.
        readOnly:
          type: boolean
          description: >
            The card lives on a board the core only reads (lina#481): every write to it is refused with 409.
        detail:
          type: boolean
          description: >
            False on an old done card whose history the core does not keep: its detail has no runs or comments.
    WorkCardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/WorkCardSummary"
    Todo:
      type: object
      additionalProperties: false
      required: [id, title, kind, done]
      properties:
        id:
          type: string
          description: owner/repo#n for an issue; check-N for a checklist item.
        title:
          type: string
        kind:
          type: string
          enum: [issue, check]
        done:
          type: boolean
    WorkerRun:
      type: object
      additionalProperties: false
      required: [id, kind, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [omo, quick-issue, lina-worker]
        firstSeenAt:
          type: integer
        lastSeenAt:
          type: integer
    GateResult:
      type: object
      additionalProperties: false
      required: [command, exitCode, passed, waiting, outputTail, at]
      properties:
        command:
          type: string
        exitCode:
          type: integer
          nullable: true
        passed:
          type: boolean
        waiting:
          type: boolean
          description: The gate exited 75 (still waiting).
        outputTail:
          type: string
        at:
          type: integer
    Comment:
      type: object
      additionalProperties: false
      required: [id, author, body, createdAt]
      properties:
        id:
          type: integer
        author:
          type: string
        body:
          type: string
        createdAt:
          type: integer
    CardRun:
      type: object
      additionalProperties: false
      required: [id, profile, status, outcome, startedAt, endedAt, lastHeartbeatAt, summary, live]
      properties:
        id:
          type: integer
        profile:
          type: string
          nullable: true
        status:
          type: string
        outcome:
          type: string
          nullable: true
        startedAt:
          type: integer
        endedAt:
          type: integer
          nullable: true
        lastHeartbeatAt:
          type: integer
          nullable: true
        summary:
          type: string
          nullable: true
        live:
          type: boolean
    WorkCardDetail:
      type: object
      additionalProperties: false
      required: [id, title, agent, state, reason, elapsedSeconds, todoProgress, now, plain,
                 todos, workerRuns, gates, comments, runs]
      properties:
        id:
          type: string
        title:
          type: string
        agent:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        elapsedSeconds:
          type: integer
          minimum: 0
        todoProgress:
          $ref: "#/components/schemas/TodoProgress"
        now:
          type: string
          nullable: true
          maxLength: 120
        plain:
          $ref: "#/components/schemas/PlainDetailLines"
        endedAt:
          type: integer
          nullable: true
          description: When a done card completed (completed_at, epoch seconds); null otherwise (lina#577).
        lastHeartbeatAt:
          type: integer
          nullable: true
          description: The card's last heartbeat (epoch seconds); null when it has none (lina#577).
        readOnly:
          type: boolean
          description: The card lives on a board the core only reads (lina#481); every write to it is refused with 409.
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
        workerRuns:
          type: array
          items:
            $ref: "#/components/schemas/WorkerRun"
        gates:
          type: array
          description: The latest result per gate command.
          items:
            $ref: "#/components/schemas/GateResult"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CardRun"
    Evidence:
      type: object
      additionalProperties: false
      required: [cardId, title, summary, metadata, completedAt]
      properties:
        cardId:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        completedAt:
          type: integer
          nullable: true
    WorkGoal:
      type: object
      additionalProperties: false
      required: [id, title, agent, state, reason, elapsedSeconds, workCards, evidence]
      properties:
        id:
          type: string
        title:
          type: string
        agent:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        elapsedSeconds:
          type: integer
          minimum: 0
        readOnly:
          type: boolean
          description: The goal lives on a board the core only reads (lina#481); every write to it is refused with 409.
        workCards:
          type: array
          items:
            $ref: "#/components/schemas/WorkCardSummary"
        evidence:
          type: array
          description: Completion summary and metadata of the goal card and its done work cards.
          items:
            $ref: "#/components/schemas/Evidence"
    GoalList:
      type: object
      additionalProperties: false
      required: [goals]
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/WorkGoal"
    InboxBlocked:
      type: object
      additionalProperties: false
      required: [cardId, title, agent, state, reason, blockKind, blockReason]
      properties:
        cardId:
          type: string
        title:
          type: string
        agent:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        blockKind:
          type: string
          nullable: true
          enum: [dependency, needs_input, capability, transient, null]
        blockReason:
          type: string
          nullable: true
    InboxQuestion:
      type: object
      additionalProperties: false
      required: [cardId, title, agent, commentId, body, askedAt]
      properties:
        cardId:
          type: string
        title:
          type: string
        agent:
          type: string
          nullable: true
        commentId:
          type: integer
        body:
          type: string
        askedAt:
          type: integer
    Inbox:
      type: object
      additionalProperties: false
      required: [blocked, questions]
      properties:
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/InboxBlocked"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/InboxQuestion"
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        author:
          type: string
          default: owner
    ReportSummary:
      type: object
      additionalProperties: false
      description: >
        One report without its body. The app's report card (lina-app#50) shows `title`, `summary`, `agent`,
        `updatedAt` and `version`, and opens `page` or GET /reports/{id}.
      required: [id, title, summary, agent, card, goal, private, version, createdAt, updatedAt, page]
      properties:
        id:
          type: string
          description: rep_ and 12 hex digits.
        title:
          type: string
        summary:
          type: string
          description: One line, the line the chat shows.
        agent:
          type: string
          description: The agent that wrote it.
        card:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        private:
          type: boolean
          description: Written from the owner's private material; served only to the owner's session.
        version:
          type: integer
          description: The newest version's number (1 for a report never edited).
        createdAt:
          type: integer
        updatedAt:
          type: integer
        page:
          type: string
          description: The page's path on this server (GET /reports/{id}/page).
    ReportList:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/ReportSummary"
    ReportVersion:
      type: object
      additionalProperties: false
      required: [version, at, title, summary]
      properties:
        version:
          type: integer
        at:
          type: integer
        title:
          type: string
        summary:
          type: string
    Report:
      type: object
      additionalProperties: false
      description: >
        A report: the ReportSummary fields, the body of `shownVersion` (markdown; `title` and `summary` are that
        version's too) and every version's number, time and line.
      required: [id, title, summary, agent, card, goal, private, version, createdAt, updatedAt, page, body,
                 shownVersion, versions]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        agent:
          type: string
        card:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        private:
          type: boolean
        version:
          type: integer
        createdAt:
          type: integer
        updatedAt:
          type: integer
        page:
          type: string
        body:
          type: string
        shownVersion:
          type: integer
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ReportVersion"
    ReportReference:
      type: string
      pattern: "^\\[\\[report:rep_[0-9a-f]{12}\\|[^|\\s]+\\|.+\\]\\]$"
      description: >
        A chat message's reference to a report: a line of its own, `[[report:<id>|<page address>|<summary>]]`,
        that the `report` tool returns (gateway/report_reference.py). Fields: `id` the report's id, `page` the page
        address (the dashboard's public URL and /reports/{id}/page), `summary` its one line. A client with
        report cards shows a card for the line and reads GET /reports/{id}; a platform without cards (Telegram)
        sends the summary line and the page link instead. The report's body is never in the message.
    AnswerResult:
      type: object
      additionalProperties: false
      required: [ok, cardId, commentId, unblocked, state, reason]
      properties:
        ok:
          type: boolean
        cardId:
          type: string
        commentId:
          type: integer
        unblocked:
          type: boolean
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
