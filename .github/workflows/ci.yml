name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-panel:
    name: mac panel native and Flutter build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned Flutter version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: true
      - name: Test clipboard, shortcuts and visible-frame validation
        run: swift test --package-path spikes/mac-panel -j 2
      - name: Verify shortcut-to-visible evidence and rejection cases
        run: node --test spikes/mac-panel/visible-evidence.test.mjs
      - name: Compile and ad-hoc sign the probe's global-shortcut stimulus
        run: LINA_PROBE_SIGN=adhoc LINA_PROBE_APP="$RUNNER_TEMP/LINA Probe.app" scripts/benchmarks/probe/build.sh
      - name: Build the Flutter panel with ad-hoc signing
        working-directory: spikes/mac-panel
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release --no-pub
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements build/macos/Build/Products/Release/mac_panel.app
          codesign --verify --deep --strict build/macos/Build/Products/Release/mac_panel.app
      - name: Verify the hidden Flutter first frame reaches the platform channel
        run: node scripts/mac-panel.mjs smoke-flutter

  launcher-baseline:
    name: launcher baseline analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test benchmark annotation validation and statistics
        run: python3 -m unittest discover -s scripts/benchmarks/tests -p 'test_*.py' -v

  probe-recorder:
    name: probe recorder
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test recorder clock and trial JSON without screen access
        run: scripts/benchmarks/probe/tests/run.sh
      - name: Compile the signed app target without installing or requesting grants
        env:
          LINA_PROBE_APP: ${{ runner.temp }}/LINA Probe.app
          LINA_PROBE_SIGN: adhoc
        run: scripts/benchmarks/probe/build.sh

  design-study:
    name: design-study
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/design-study/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: scripts/design-study
      - name: Verify contrast, expression rules and committed renders
        working-directory: scripts/design-study
        run: npm test && npm run check
  flutter:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned Flutter version
        id: pin
        run: |
          v=$(tr -d '[:space:]' < .flutter-version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: true
      - name: Check Flutter version matches the pin
        run: |
          flutter --version | head -1 | grep -q "Flutter ${{ steps.pin.outputs.version }} "
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test token generation, contrast and visual lint regressions
        run: node --test scripts/verify/design.test.mjs scripts/verify/protocol.test.mjs scripts/verify/mac-session.test.mjs scripts/verify/swift-tokens.test.mjs scripts/verify/launcher-evidence.test.mjs
      - name: Check research formatting and scripts
        run: |
          dart format --output=none --set-exit-if-changed spikes/korean-input/lib spikes/korean-input/test
          bash -n spikes/korean-input/tool/linux_ime.sh
          python3 -m py_compile spikes/korean-input/tool/*.py
      - name: Run the app foundation gate
        run: node scripts/foundation.mjs
      - name: Preserve foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-evidence
          path: build/foundation-evidence.json
          if-no-files-found: error

  linux-ime:
    name: linux-ime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned Flutter version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: true
      - name: Install native input experiment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            fcitx5 fcitx5-hangul fcitx5-frontend-gtk3 xvfb xdotool imagemagick \
            dbus-x11 at-spi2-core python3-gi gir1.2-gtk-3.0 fonts-wqy-zenhei
      - name: Build and record the real fcitx5 path
        working-directory: spikes/korean-input
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --debug --no-pub --dart-define=IME_TRACE=true
          tool/linux_ime.sh "$RUNNER_TEMP/korean-input-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ime-observations
          path: ${{ runner.temp }}/korean-input-evidence
          if-no-files-found: error

  native:
    name: native-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux, os: ubuntu-latest}
          - {target: android, os: ubuntu-latest}
          - {target: windows, os: windows-latest}
          - {target: macos, os: macos-latest}
          - {target: ios, os: macos-latest}
          - {target: ios-simulator, os: macos-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Read the Flutter pin
        id: pin
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: true
      - name: Linux desktop prerequisites
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize the pinned Flutter tool
        run: flutter --version
      - name: Verify and build the native artifact
        run: node scripts/build.mjs ${{ matrix.target }}
      - name: Test production launcher, menu bar status and opt-in guards
        if: matrix.target == 'macos'
        env:
          LINA_EMOJI_APP_RESOURCE: ${{ github.workspace }}/packages/lina_app/build/macos/Build/Products/Release/LINA.app/Contents/Resources/emoji.json
          LINA_EMOJI_CAPTURES: ${{ github.workspace }}/docs/captures/46
          LINA_DICTIONARY_CAPTURES: ${{ github.workspace }}/docs/captures/44
          LINA_TRANSLATION_CAPTURES: ${{ github.workspace }}/docs/captures/45
        run: swift test --package-path packages/lina_app/macos -j 2
      - name: Verify translation routing with network denied
        if: matrix.target == 'macos'
        run: node scripts/translation.mjs
      - name: Verify Dictionary Services with network denied
        if: matrix.target == 'macos'
        run: node scripts/dictionary.mjs
      - name: Verify hidden launcher first frame and external fixture focus
        if: matrix.target == 'macos'
        run: |
          node scripts/launcher.mjs smoke
          node scripts/launcher.mjs evidence
      - name: Verify local calculator copies and zero Core requests from the app log
        if: matrix.target == 'macos'
        run: node scripts/calculator.mjs
      - name: Verify menu bar disconnects when the fake Core stops
        if: matrix.target == 'macos'
        run: node scripts/status-item.mjs
      - name: Preserve production launcher captures
        if: always() && matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-evidence
          path: |
            docs/captures/31/
            docs/captures/49/
            docs/captures/44/
            docs/captures/46/
            docs/captures/45/
            docs/captures/40/
          if-no-files-found: error
      - name: Preserve native verification and artifact digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-evidence
          path: |
            build/foundation-evidence.json
            build/artifacts/*.json
          if-no-files-found: error
