name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-study:
    name: design-study
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/design-study/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: scripts/design-study
      - name: Verify contrast, expression rules and committed renders
        working-directory: scripts/design-study
        run: npm test && npm run check
  flutter:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned Flutter version
        id: pin
        run: |
          v=$(tr -d '[:space:]' < .flutter-version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: true
      - name: Check Flutter version matches the pin
        run: |
          flutter --version | head -1 | grep -q "Flutter ${{ steps.pin.outputs.version }} "
      - name: Analyze and test every Dart package
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(git ls-files '*pubspec.yaml' | xargs -r -n1 dirname | sort)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No Dart packages yet; nothing to analyze."
            exit 0
          fi
          for p in "${pkgs[@]}"; do
            echo "::group::$p"
            if [ -f "$p/pubspec.lock" ]; then
              (cd "$p" && flutter pub get --enforce-lockfile)
            else
              (cd "$p" && flutter pub get)
            fi
            (cd "$p" && flutter analyze)
            if [ -d "$p/test" ]; then (cd "$p" && flutter test); fi
            echo "::endgroup::"
          done
