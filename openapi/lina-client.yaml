# Checked-in stand-in for the endpoints the first screens read.
# The core does not serve this schema until lina-system/lina#39.
# scripts/generate-client.mjs is the only reader. Switching its source to the
# core's schema file is part of #39; do not fetch a live core from here.
openapi: 3.0.3
info:
  title: LINA client API
  version: 0.0.1-alpha.20261102.1
  description: >
    Read endpoints for the first screens: home (summary, agents, goals and
    to-dos), notifications, and machine plus model-quota status.
paths:
  /api/home:
    get:
      operationId: getHome
      summary: Home summary and each agent's goals and to-dos.
      responses:
        "200":
          description: Home payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
  /api/notifications:
    get:
      operationId: getNotifications
      summary: Notifications and the unread count kept by the core.
      responses:
        "200":
          description: Notification list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /api/status:
    get:
      operationId: getStatus
      summary: Machines and model quota windows.
      responses:
        "200":
          description: Status payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
components:
  schemas:
    WorkState:
      type: string
      description: The five states. The reason, when present, is one word.
      enum:
        - planned
        - in_progress
        - waiting
        - stopped
        - done
    Home:
      type: object
      additionalProperties: false
      required:
        - summary
        - agents
      properties:
        summary:
          $ref: "#/components/schemas/HomeSummary"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    HomeSummary:
      type: object
      additionalProperties: false
      required:
        - goalCount
        - todoCount
        - runCount
      properties:
        goalCount:
          type: integer
          minimum: 0
        todoCount:
          type: integer
          minimum: 0
        runCount:
          type: integer
          minimum: 0
    Agent:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - goals
      properties:
        id:
          type: string
        name:
          type: string
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
    Goal:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - todos
      properties:
        id:
          type: string
        title:
          type: string
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
    Todo:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - state
        - addedBy
        - runs
      properties:
        id:
          type: string
        title:
          type: string
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          type: string
          description: One word after the state, when the core has one.
        addedBy:
          type: string
          description: Who added the to-do. Most rows come from an agent.
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
    Run:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - state
      properties:
        id:
          type: string
        title:
          type: string
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          type: string
    NotificationList:
      type: object
      additionalProperties: false
      required:
        - unreadCount
        - items
      properties:
        unreadCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
    Notification:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - read
      properties:
        id:
          type: string
        title:
          type: string
        read:
          type: boolean
    Status:
      type: object
      additionalProperties: false
      required:
        - machines
        - quota
      properties:
        machines:
          type: array
          items:
            $ref: "#/components/schemas/Machine"
        quota:
          type: array
          items:
            $ref: "#/components/schemas/QuotaWindow"
    Machine:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - state
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
          enum:
            - up
            - down
            - busy
    QuotaWindow:
      type: object
      additionalProperties: false
      required:
        - model
        - remaining
        - window
      properties:
        model:
          type: string
        remaining:
          type: integer
          minimum: 0
        window:
          type: string
